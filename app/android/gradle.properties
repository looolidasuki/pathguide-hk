org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# 刻意不写以下两行（它们会被 Flutter migrator 自动加回来，加回时要删掉）：
#
#   android.builtInKotlin=false
#   android.newDsl=false
#
# 这两个属性是 AGP 9 才认识的。我们已回退到 AGP 8.13.2（因为 AGP 9 要求所有
# 插件改用 built-in Kotlin，而 flutter_tts 仍用旧式 Kotlin Gradle Plugin
# 应用方式，构建会失败 —— flutter/flutter#192111、#192167）。
#
# 注意：`flutter run` / `flutter build` 里的 Flutter migrator 会**自动把这两行
# 加回来**（注释写着 "added automatically by Flutter migrator"）。发现它们
# 出现时删掉即可。scripts/check_toolchain_versions.py 会检查这一点。
#
# 本文件被 Flutter 工具重写时，上面的说明可能丢失；以脚本检查结果为准。
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
