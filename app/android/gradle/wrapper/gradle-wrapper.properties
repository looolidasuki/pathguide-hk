distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
# 刻意停在 Gradle 8.x，不用 flutter create 模板给的 9.3.1。
# Flutter 3.47 的模板生成 AGP 9.1.0 + Gradle 9.3.1，而 AGP 9 要求所有插件改用
# built-in Kotlin；flutter_tts 仍在用旧的 Kotlin Gradle Plugin 应用方式，
# 构建因此失败（flutter/flutter#192111、#192167）。
# 回退到 8.x 是改动最小的一条路：只改版本号，不动插件与业务代码。
distributionUrl=https\://services.gradle.org/distributions/gradle-8.13-all.zip
