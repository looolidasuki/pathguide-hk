distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
# 版本约束（三条同时成立，不是随手挑的）：
#   1. Flutter 3.47.5 硬校验 Gradle >= 8.14.0（低于此值构建直接 FAILED）
#   2. AGP 8.13.2 属 8.x，Gradle 主版本应同为 8.x
#   3. Gradle 8.x 的最后一个稳定版是 8.14.5（已查 services.gradle.org/versions/all）
# 不能用模板默认的 9.3.1：AGP 9 要求所有插件改用 built-in Kotlin，
# 而 flutter_tts 仍用旧式 Kotlin Gradle Plugin 应用方式
# （flutter/flutter#192111、#192167）。
distributionUrl=https\://services.gradle.org/distributions/gradle-8.14.5-all.zip
